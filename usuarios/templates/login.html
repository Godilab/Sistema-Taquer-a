<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Taquería Los Inges</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center p-6 font-sans">
    <div class="bg-white w-full max-w-md rounded-[3.5rem] p-12 shadow-2xl animate-in fade-in zoom-in duration-500">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-orange-500 text-white rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-lg shadow-orange-200">
                <i data-feather="shield" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black italic uppercase text-slate-900 leading-none">Bienvenido</h1>
            <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.4em] mt-3">Panel de Gestión Taquera</p>
        </div>

        <form id="loginForm" action="{{ url_for('usuarios.login') }}" method="POST" class="space-y-6">
            <div class="space-y-2">
                <label class="text-[9px] font-black text-slate-400 uppercase ml-4 tracking-widest">Correo Electrónico</label>
                <input type="email" id="email" name="email" required 
                       class="w-full bg-slate-50 border-none rounded-2xl px-6 py-5 font-bold focus:ring-2 focus:ring-orange-500 outline-none transition-all"
                       placeholder="admin@taqueria.com">
            </div>
            
            <div class="space-y-2">
                <label class="text-[9px] font-black text-slate-400 uppercase ml-4 tracking-widest">Contraseña</label>
                <input type="password" id="password" name="password" required 
                       class="w-full bg-slate-50 border-none rounded-2xl px-6 py-5 font-bold focus:ring-2 focus:ring-orange-500 outline-none transition-all"
                       placeholder="••••••••">
            </div>
            
            <div class="pt-4">
                <button type="submit" class="w-full bg-slate-900 text-white font-black py-6 rounded-[2.5rem] uppercase text-xs tracking-[0.2em] hover:bg-slate-800 active:scale-95 transition-all shadow-xl shadow-slate-200 flex items-center justify-center gap-3">
                    Entrar al Sistema <i data-feather="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
        </form>
    </div>

    <script>
        feather.replace();
        function mostrarNotificacion(mensaje, tipo = 'success') {
            const toast = document.createElement('div');
            const bgClass = tipo === 'error' ? 'bg-red-500' : 'bg-emerald-500';
            toast.className = `fixed bottom-10 left-1/2 -translate-x-1/2 ${bgClass} text-white px-8 py-4 rounded-2xl shadow-2xl flex items-center gap-3 font-black uppercase text-[10px] tracking-widest z-[100] transition-all animate-in slide-in-from-bottom-10 fade-in duration-300`;
            toast.innerHTML = `<i data-feather="alert-circle" class="w-5 h-5"></i><span>${mensaje}</span>`;
            document.body.appendChild(toast);
            feather.replace(); 
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}{% for category, message in messages %}
                    mostrarNotificacion("{{ message }}", "{{ 'error' if category == 'danger' else 'success' }}");
                {% endfor %}{% endif %}
            {% endwith %}
        });
    </script>
</body>
</html>
