<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-orange-50 min-h-screen flex items-center justify-center p-6 font-sans">
    <div class="bg-white w-full max-w-md rounded-[3.5rem] p-12 shadow-2xl animate-in fade-in zoom-in duration-500">
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-slate-900 text-white rounded-[2rem] flex items-center justify-center mx-auto mb-6 shadow-lg shadow-slate-200">
                <i data-feather="key" class="w-10 h-10"></i>
            </div>
            <h1 class="text-3xl font-black italic uppercase text-slate-900 leading-none">Paso Final</h1>
            <p class="text-slate-400 font-bold text-[10px] uppercase tracking-[0.2em] mt-3">Ingresa el código enviado a tu correo registrado</p>
        </div>

        <form action="{{ url_for('usuarios.verificar_2fa') }}" method="POST" class="space-y-6">
            <div class="flex justify-between gap-2">
                <input type="text" name="codigo" required maxlength="6" pattern="[0-9]{6}"
                       class="w-full bg-slate-50 border-none rounded-2xl px-6 py-5 font-black text-3xl tracking-[0.5em] text-center focus:ring-2 focus:ring-orange-500 outline-none transition-all text-slate-700"
                       placeholder="••••••" autocomplete="off">
            </div>
            <button type="submit" class="w-full bg-orange-500 text-white font-black py-6 rounded-[2.5rem] uppercase text-xs tracking-widest hover:bg-orange-600 active:scale-95 transition-all shadow-xl shadow-orange-100 flex items-center justify-center gap-3">
                Verificar Acceso <i data-feather="check-circle" class="w-4 h-4"></i>
            </button>
            <a href="{{ url_for('usuarios.login') }}" class="block text-center w-full text-slate-400 font-bold uppercase text-[10px] hover:text-slate-600">Volver al Login</a>
        </form>
    </div>
    <script>
        feather.replace();
        // Sistema de notificaciones (igual al de login)
    </script>
</body>
</html>
