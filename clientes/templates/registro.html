<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Cliente | La Taquería</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-orange-50 min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-md">

        <!-- Logo / Título -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto bg-orange-500 rounded-2xl flex items-center justify-center text-white text-3xl shadow-lg">
                🌮
            </div>
            <h1 class="text-3xl font-black italic uppercase text-slate-900 mt-4 tracking-tight">
                La Taquería
            </h1>
            <p class="text-orange-600 text-xs font-black uppercase tracking-widest mt-1">
                Crear Cuenta
            </p>
        </div>

        <!-- Card -->
        <div class="bg-white rounded-[3rem] p-10 shadow-2xl border border-orange-100">

            <!-- Título -->
            <h2 class="text-2xl font-black italic uppercase text-slate-900 mb-6 text-center">
                Registro
            </h2>

            <!-- Mensajes -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-3 rounded-xl text-sm font-bold 
                            {% if category == 'error' %} bg-red-100 text-red-600 
                            {% else %} bg-green-100 text-green-600 {% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Formulario -->
            <form method="POST" class="space-y-5">

                <input type="text" name="nombre" placeholder="Nombre completo" required
                    class="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 font-bold text-sm focus:ring-2 focus:ring-orange-500 outline-none">

                <input type="email" name="correo" placeholder="Correo electrónico" required
                    class="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 font-bold text-sm focus:ring-2 focus:ring-orange-500 outline-none">

                <input type="tel" name="telefono" placeholder="Teléfono"
                    class="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 font-bold text-sm focus:ring-2 focus:ring-orange-500 outline-none">

                <input type="password" name="password" placeholder="Contraseña" required
                    class="w-full bg-slate-50 border-none rounded-2xl px-6 py-4 font-bold text-sm focus:ring-2 focus:ring-orange-500 outline-none">

                <button type="submit"
                    class="w-full bg-slate-900 text-white font-black py-5 rounded-[2rem] uppercase text-xs tracking-widest hover:bg-orange-500 transition-all shadow-xl">
                    Crear Cuenta 🔥
                </button>
            </form>

            <!-- Login -->
            <p class="text-center text-xs text-slate-400 mt-6 font-bold">
                ¿Ya tienes cuenta?
                <a href="{{ url_for('clientes.login') }}" class="text-orange-500 hover:underline">
                    Inicia sesión
                </a>
            </p>

        </div>

    </div>

</body>
</html>
